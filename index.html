<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxey Army</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #f2f4f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
            position: relative;
        }
        .logo-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 20px auto;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #7C3AED;
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1E1B4B;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .join-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 100%);
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(109, 40, 217, 0.35);
            transition: all 0.3s ease;
        }
        .join-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(109, 40, 217, 0.45);
        }
        .join-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-container">
            <!-- আপনার রাজকীয় লোগোটি এখানে ডাইরেক্ট লিংকসহ যুক্ত করা হলো -->
            <img src="https://i.ibb.co.com/84j7qM7q/10943.png" alt="Roxey Army Logo">
            <div class="badge">✓</div>
        </div>
        
        <h1>ROXEY ARMY</h1>

        <!-- আপনার টেলিগ্রাম চ্যানেলের লিংক -->
        <a href="https://t.me/+rA7XhaGRriRlMzhl" class="join-btn" target="_blank">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.99 1.27-5.62 3.72-.53.36-1.01.54-1.44.53-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.96-.75 3.78-1.65 6.31-2.74 7.58-3.27 3.61-1.51 4.36-1.77 4.85-1.78.11 0 .35.03.5.15.13.11.17.26.19.37 0 .07.02.24 0 .38z"/>
            </svg>
            Join Telegram
        </a>
    </div>

</body>
</html>
